<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArchiveX — Your university past-question archive. Browse, find, and download past exam questions by faculty, department, level, and semester." />
    <meta name="keywords" content="university past questions, exam archive, past papers, study materials, university exams, course materials" />
    <meta name="author" content="ArchiveX" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f2d52" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archive-x-eight.vercel.app/" />
    <meta property="og:title" content="ArchiveX — University Past Question Archive" />
    <meta property="og:description" content="Browse, find, and download past exam questions by faculty, department, level, and semester. Your ultimate study resource." />
    <meta property="og:image" content="https://archive-x-eight.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ArchiveX" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://archive-x-eight.vercel.app/" />
    <meta name="twitter:title" content="ArchiveX — University Past Question Archive" />
    <meta name="twitter:description" content="Browse, find, and download past exam questions by faculty, department, level, and semester." />
    <meta name="twitter:image" content="https://archive-x-eight.vercel.app/og-image.png" />

    <title>ArchiveX — University Past Question Archive</title>
    <link rel="canonical" href="https://archive-x-eight.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ArchiveX",
      "url": "https://archive-x-eight.vercel.app",
      "description": "University past question archive for browsing and downloading exam materials.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://archivex.example.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('archivex-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
